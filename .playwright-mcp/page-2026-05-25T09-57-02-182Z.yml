                - paragraph [ref=e214]: Certificate of Clinical Medicine and Master’s degree in Obstetrics and Gynecology from China
                - paragraph [ref=e215]: Experience
                - paragraph [ref=e216]:
                  - text: – In 2014, she started her career at the Khmer Soviet Friendship Hospital which is known as one of the most famous and good-quality hospitals that serve the Kingdom of Cambodia for many years.
                  - text: – With her long years of experience in medicine coupled with high education and training from local and international institutes, she has been making multiple achievements in the healthcare industry. She has served for many years with her expertise in Gynecology, Obstetrics, and fertility treatment; and implements Gynecology Sonography.
                  - text: – In 2017, she completed her medical training in Reproductive Medicine at Fertility Center, Queensland and Fertility Group, Brisbane City in Australia.
                  - text: – She became a member of the Improving Comprehensive Services for Cervical Cancer and training course in Japan in 2016. With her clinical experience, passion for high-quality care, and proven specialization through the years, she is committed to helping all women in Cambodia achieved the care they need.
